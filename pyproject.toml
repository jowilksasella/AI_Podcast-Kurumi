[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kurumi-research-podcast"
version = "0.2.0"
description = "A preview-first, Kurumi-led workflow for turning research into casual Mandarin dialogue."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pypdf>=4"]

[project.scripts]
kurumi-podcast = "kurumi_podcast.cli:main"

[tool.setuptools.packages.find]
include = ["kurumi_podcast*"]

